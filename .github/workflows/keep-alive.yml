name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # ping ทุก 10 นาที (Render หลับหลัง 15 นาที)
  workflow_dispatch:          # กด run เองด้วยมือได้

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kmutt-pwd-backend.onrender.com/api/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
          fi
