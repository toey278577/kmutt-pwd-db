server {
    server_name kmutt-pwd.duckdns.org 66-42-63-65.sslip.io;
    root /opt/kmutt/frontend/dist;
    index index.html;
    client_max_body_size 25M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # เปลือกแอป — ห้าม cache ไม่งั้นผู้ใช้ยังติดเวอร์ชันเก่าหลัง deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ไฟล์ที่มี hash ในชื่อ — cache ยาวได้ปลอดภัย เพราะเปลี่ยนโค้ดแล้วชื่อไฟล์เปลี่ยนตาม
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/66-42-63-65.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/66-42-63-65.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    if ($host = kmutt-pwd.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = 66-42-63-65.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name kmutt-pwd.duckdns.org 66-42-63-65.sslip.io;
    return 404; # managed by Certbot




}